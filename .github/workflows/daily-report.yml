name: Daily POS report

on:
  workflow_dispatch:
  schedule:
    # 03:15 WIB daily. GitHub cron is UTC, so this runs at 20:15 UTC.
    - cron: "15 20 * * *"

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLSERA_ACCESS_TOKEN: ${{ secrets.OLSERA_ACCESS_TOKEN }}
      OLSERA_STORE_URL_ID: ${{ secrets.OLSERA_STORE_URL_ID }}
      OLSERA_DASH_EMAIL: ${{ secrets.OLSERA_DASH_EMAIL }}
      OLSERA_DASH_PASSWORD: ${{ secrets.OLSERA_DASH_PASSWORD }}
      OLSERA_CONTEXT_JSON: ${{ secrets.OLSERA_CONTEXT_JSON }}
      OLSERA_CONTEXT_BASE64: ${{ secrets.OLSERA_CONTEXT_BASE64 }}
      SNAPOBOX_EMAIL: ${{ secrets.SNAPOBOX_EMAIL }}
      SNAPOBOX_PASSWORD: ${{ secrets.SNAPOBOX_PASSWORD }}
      ZONA_USERNAME: ${{ secrets.ZONA_USERNAME }}
      ZONA_PASSWORD: ${{ secrets.ZONA_PASSWORD }}
      SNAPOSNAP_SHEET_ID: ${{ secrets.SNAPOSNAP_SHEET_ID }}
      TMD_SHEET_ID: ${{ secrets.TMD_SHEET_ID }}
      TMD_SHEET_GID: ${{ secrets.TMD_SHEET_GID }}
      TMD_SHEET_RANGE: ${{ secrets.TMD_SHEET_RANGE }}
      SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
      SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
      SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
      SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh report JSON
        run: npm run refresh:report

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- src/data/markarta-report.json; then
            echo "No report data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/markarta-report.json
          git commit -m "Refresh daily POS report data"
          git push
